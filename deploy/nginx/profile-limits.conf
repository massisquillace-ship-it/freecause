# server context, before the generic / and PHP locations. Keep legacy redirects first.
# Four concurrent profile requests per visitor; reserve PHP capacity for other pages.
# Cloudflare challenges unverified profile traffic before it reaches these limits.
location ~ ^/([a-z][a-z]/)?(user|usuario|utilisateur|benutzer|utente|ususario|anvandare|bruger|gebruiker|kullanici|utentes)/ {
    limit_conn profile_client 4;
    limit_conn profile_conc 40;
    limit_req zone=profile_scrape burst=15 nodelay;
    limit_conn_status 429;
    limit_req_status 429;
    error_page 429 = @profile_busy;
    try_files $uri $uri/ /index.php?$query_string;
}

location @profile_busy {
    add_header Retry-After 30 always;
    add_header Cache-Control "private, no-store" always;
    return 429;
}
